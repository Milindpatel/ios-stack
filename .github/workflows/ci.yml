name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build stackView for the iOS Simulator
        run: xcodebuild -project stackView/stackView.xcodeproj -target stackView -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Build stak for the iOS Simulator
        run: xcodebuild -project stackView/stak/stak.xcodeproj -target stak -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
